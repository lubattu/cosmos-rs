[package]
name = "cosmos-paper"
description = "Reproduction driver for the experiments reported in the COSMOS article"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
cosmos-rs = { path = "../cosmos-rs", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
ndarray = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
toml = "1.1"
ureq = "3"
walkdir = "2"

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/cosmos-rs", "crates/cosmos-paper", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Battú <lucasdryuu@gmail.com>"]
repository = "https://github.com/ryuuft/cosmos-rs"
homepage = "https://github.com/ryuuft/cosmos-rs"
documentation = "https://docs.rs/cosmos-rs"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

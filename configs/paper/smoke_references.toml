# Expectations for shortened runs.
#
# Every value below was produced by this crate's own shortened runs and is
# recorded here as a regression reference: a later run that drifts away from
# it has changed behaviour. A shortened run executes the same objective,
# loss, model and rule as the full run; only the epoch count and the seed
# list are reduced. A value outside tolerance is a defect to investigate,
# never a reason to retune.
#
# An accuracy is compared to 1.5 points absolute, which absorbs the
# last-digit differences between numerical backends without hiding a change
# of behaviour. Every other scalar is compared to 5 % of its reference once
# its magnitude reaches near_zero_reference. Below that magnitude the
# treatment depends on whether the quantity can change sign: a signed
# quantity uses the absolute floor near_zero_absolute, because a relative
# band around a value near zero is narrower than the arithmetic itself,
# while a strictly positive quantity keeps a relative band, widened to
# positive_small_relative.
#
# A cell whose file carries more than one arm names its arm in the entry
# name, as "<cell>:<arm>", so the entry is matched to that arm alone.

[tolerance]
accuracy_points           = 1.5
orthogonality_upper_bound = 1e-12
relative                  = 0.05
near_zero_reference       = 0.05
near_zero_absolute        = 0.005
positive_small_relative   = 0.20


# The benchmark has no per-epoch history: it is held to structural
# expectations instead.
[bench]
name   = "bench"
config = "configs/paper/bench.toml"
engine = "bench"
orthogonality_upper_bound = 1.0e-11
require_slopes            = true
require_block_qr_monotone = true
# Two adjacent sizes are compared only when the larger is at least this
# many times the smaller, and a fall of up to monotone_tolerance is
# accepted: a wall-clock median over close sizes spreads further than the
# cost difference it is meant to show.
monotone_min_size_ratio   = 2.0
monotone_tolerance        = 0.10
